<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Play Sandtraption · GrindWorks</title>
  <link rel="icon" href="../../assets/grindworks-gear.png">
  <style>
    html, body { margin:0; height:100%; background:#17110d; color:#f6e9c9; font-family:Georgia, serif; overflow:hidden; }
    #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    /* Portrait game: on phones fill the screen, on desktop a tall 9:16-ish window */
    #unity-canvas { display:block; background:#231912; width:100vw; height:100vh; height:100dvh; touch-action:none; }
    @media (min-aspect-ratio: 3/4) {
      #unity-canvas { height:94vh; width:calc(94vh * 0.5625); border:2px solid #c9963a; border-radius:10px; }
    }
    #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#17110d; text-align:center; padding:24px; }
    #loading img { width:96px; height:96px; }
    #loading h1 { margin:0; color:#e8b450; font-size:2rem; letter-spacing:.02em; }
    #bar { width:min(320px,70vw); height:12px; border:1px solid #c9963a; border-radius:8px; overflow:hidden; }
    #fill { height:100%; width:0; background:linear-gradient(90deg,#e8b450,#c9963a); transition:width .2s; }
    #loading p { margin:0; color:#c8b896; font-size:.95rem; max-width:360px; }
    #err { display:none; color:#ffb3a0; }
    #back { position:fixed; top:10px; left:12px; color:#c8b896; font:14px/1 sans-serif; text-decoration:none; opacity:.8; z-index:2; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading">
    <img src="../../assets/grindworks-gear.png" alt="">
    <h1>Sandtraption</h1>
    <div id="bar"><div id="fill"></div></div>
    <p id="msg">Loading the workshop… (about 41 MB, best on Wi-Fi)</p>
    <p>Early test version: unfinished, and things will change.</p>
    <p id="err"></p>
  </div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/a9b510989be6d1251be7e7457992c637.data.unityweb",
      frameworkUrl: buildUrl + "/c06a98303c524d29577dec1b43910ee3.framework.js.unityweb",
      codeUrl: buildUrl + "/039ff410ee6995775780c34a8e627a6a.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GrindWorks",
      productName: "Sandtraption",
      productVersion: "0.3.0",
      showBanner: function (msg, type) { if (type === "error") showError(msg); else console.log(msg); }
    };
    // Phones: cap the render resolution so the game runs smoothly
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    }
    function showError(m) {
      document.getElementById("loading").style.display = "flex";
      document.getElementById("msg").textContent = "Sorry, the game couldn't start on this device.";
      var e = document.getElementById("err"); e.style.display = "block"; e.textContent = m;
    }
    var s = document.createElement("script");
    s.src = buildUrl + "/3b9c27bedf53543392e1a77976c5c3a0.loader.js";
    s.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (m) { showError(String(m)); });
    };
    s.onerror = function () { showError("The game files didn't load. Check your connection and refresh."); };
    document.body.appendChild(s);
  </script>
</body>
</html>
